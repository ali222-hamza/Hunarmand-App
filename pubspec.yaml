name: hunarmand
description: Pakistan skilled workers marketplace connecting artisans with opportunities
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # Firebase - keep these versions together, they work with each other
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.2

  # Local SQLite database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1

  # Utilities
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/